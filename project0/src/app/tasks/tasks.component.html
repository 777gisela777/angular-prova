<h1>{{ user() ? user()!.name + "'s tasks" : "Tasks" }}</h1>
<button>Add task</button>
<div>
      <div>
        @for (task of tasksList; track task.id) {
          @if (task.userId === user()?.id) {
            <h3>{{ task.title }}</h3>
            <p>{{ task.dueDate }}</p>
            <p>{{ task.summary }}</p>
            <button (click)="onCompleteTask(task.id)">Complete</button>
          }
        }
      </div>

</div>
