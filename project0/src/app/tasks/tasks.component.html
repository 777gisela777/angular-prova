<h1>Juan's tasks</h1>
<button>Add task</button>
<div>
  @for (task of tasksList; track task.id) {
    if (isSameUser(task.userId)) {
      <div>
        <h3>{{ task.title }}</h3>
        <p>{{ task.dueDate }}</p>
        <p>{{ task.summary }}</p>
        <button>Complete</button>
      </div>

    }
  }
</div>
